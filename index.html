<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TsHlog</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="aero-bg"></div>

  <header class="topbar">
    <h1 class="logo">TsHlog</h1>
    <form class="search-mini" action="search.html" method="get">
      <input type="text" name="q" placeholder="search tags..." />
      <button type="submit">🔍</button>
    </form>
  </header>

  <main>
    <section class="hero">
      <div class="hero-screen" id="heroPlayer">
        <div class="hero-overlay">
          <div class="hero-tags" id="heroTags"></div>
          <div class="hero-controls">
            <button id="heroRefresh" title="new random video">⟳</button>
            <button id="heroRandom" title="open random video">🎲 Random Video</button>
          </div>
        </div>
      </div>
    </section>

    <section class="categories">
      <h2>Categories</h2>
      <div class="cat-grid" id="catGrid"></div>
    </section>

    <section class="feed">
      <h2>Random Feed</h2>
      <div class="video-grid" id="videoGrid"></div>
    </section>
  </main>

  <footer>
    <p>TsHlog — powered by public APIs. 18+ only.</p>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
