<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search — TsHlog</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="aero-bg"></div>

  <header class="topbar">
    <h1 class="logo"><a href="index.html">TsHlog</a></h1>
    <form class="search-mini" id="searchForm">
      <input type="text" id="searchInput" placeholder="search tags..." />
      <button type="submit">🔍</button>
    </form>
  </header>

  <main>
    <section class="search-results">
      <h2 id="resultsTitle">Search</h2>
      <div class="tag-chips" id="tagChips"></div>
      <div class="video-grid" id="videoGrid"></div>
    </section>
  </main>

  <footer>
    <p>TsHlog — powered by public APIs. 18+ only.</p>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
